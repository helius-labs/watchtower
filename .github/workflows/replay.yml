name: Exploit replay

# Replays the Drift, Raydium and Pump.fun exploit windows against live Parsed Events every Monday and fails if Watchtower
# stops raising its critical alerts on each attack's first transaction (scripts/check-replays.mjs). Catches regressions
# in Watchtower and changes in the APIs. Needs a HELIUS_API_KEY repository secret; a run costs about 190 credits.

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: exploit-replay
  cancel-in-progress: false

jobs:
  replays:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay the exploit windows
        env:
          HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
        run: |
          if [ -z "$HELIUS_API_KEY" ]; then
            echo "::error::Add a HELIUS_API_KEY repository secret to run the exploit replay."
            exit 1
          fi
          pnpm replay:check
      # One open issue tracks a failing replay; later failures comment on it instead of opening more.
      - name: Report the failure in an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly exploit replay is failing"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing: $RUN_URL"
          else
            gh issue create --title "$title" --body "The weekly exploit replay failed: $RUN_URL

          It replays the Drift (2026), Raydium (2022) and Pump.fun (2024) exploit windows and expects a critical alert on each attack's first transaction. The run log ends with what is missing. A failure means detection regressed, the Parsed Events API changed, or the run could not reach Helius. Run \`pnpm replay:check\` locally to reproduce."
          fi
